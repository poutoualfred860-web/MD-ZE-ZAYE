<body>
<nav class="rail" id="rail" aria-label="Étapes"></nav>
<main>
<header class="top"><div class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--acc)"/><path d="M7 22l6-7 4 4 8-10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><div><div class="bn">Pronos Lab</div><div class="sub">Analyse football</div></div></div><div class="hr"><span class="pill" id="src"></span><button class="chip" onclick="th()" aria-label="Changer de thème">◐</button></div></header>
<div class="sub" id="st"></div>
<div id="app"></div>
<p class="sub">Les probabilités sont des estimations statistiques, jamais des certitudes. Jouez avec modération.</p>
</main>
<script>
// ===== CONFIG API : à renseigner =====
const CONFIG={API_BASE_URL:"/api"}; // la clé API reste sur le serveur (variable API_KEY de server.js)
const Q=new URLSearchParams(location.search);
const MODE=Q.has("demo")?"demo":Q.get("src")==="api"?"api":"csv"; // défaut : CSV gratuit ; ?src=api : API-Football ; ?demo : démonstration
const LIVE=MODE!=="demo";

 parse(t){
  const text=String(t||"").replace(/^\uFEFF/,"").replace(/^ï»¿/,"");
  const rows=[];let row=[],field="",quoted=false;
  for(let i=0;i<text.length;i++){
   const ch=text[i];
   if(quoted){if(ch==='"'&&text[i+1]==='"'){field+='"';i++}else if(ch==='"')quoted=false;else field+=ch;continue}
   if(ch==='"'){quoted=true;continue}
   if(ch===','){row.push(field);field="";continue}
   if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(v=>v!==""))rows.push(row);row=[];field="";continue}
   field+=ch;
  }
  if(field!==""||row.length){row.push(field);if(row.some(v=>v!==""))rows.push(row)}
  if(!rows.length)return[];const h=rows.shift().map(k=>k.trim());
  return rows.map(c=>{const o={};h.forEach((k,i)=>o[k]=(c[i]??"").trim());return o})
 },
 dt(d,t){const[a,b,c]=d.split("/"),[hh,mm]=(t||"12:00").split(":").map(Number);return new Date(c.length==2?2000+ +c:+c,+b-1,+a,hh,mm)},
 // Modèle attaque/défense par marché. Les lignes postérieures au coup d'envoi sont exclues.
 estimateMarket(rows,home,away,key,beforeDate){
  const cols={yc:{h:"HY",a:"AY"},sh:{h:"HS",a:"AS"},fo:{h:"HF",a:"AF"},co:{h:"HC",a:"AC"}}[key];if(!cols)return null;
  const valid=(r,col)=>r[col]!==undefined&&r[col]!==""&&Number.isFinite(Number(r[col]));
  const past=(rows||[]).filter(r=>r.Date&&r.HomeTeam&&r.AwayTeam&&valid(r,cols.h)&&valid(r,cols.a)&&(!beforeDate||this.dt(r.Date,r.Time)<beforeDate));
  const teamN=n=>past.filter(r=>r.HomeTeam===n||r.AwayTeam===n).length;
  if(teamN(home)<3||teamN(away)<3)return null;
  const mean=(arr)=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null;
  const leagueH=mean(past.map(r=>+r[cols.h])),leagueA=mean(past.map(r=>+r[cols.a]));
  if(!(leagueH>0)||!(leagueA>0))return null;
  // Lissage vers la moyenne du championnat pour limiter les petits échantillons.
  const shr=(arr,base)=>arr.length?(arr.reduce((a,b)=>a+b,0)+3*base)/(arr.length+3):base;
  const homeAttack=shr(past.filter(r=>r.HomeTeam===home).map(r=>+r[cols.h]),leagueH);
  const awayDefense=shr(past.filter(r=>r.AwayTeam===away).map(r=>+r[cols.h]),leagueH);
  const awayAttack=shr(past.filter(r=>r.AwayTeam===away).map(r=>+r[cols.a]),leagueA);
  const homeDefense=shr(past.filter(r=>r.HomeTeam===home).map(r=>+r[cols.a]),leagueA);
  const h=Math.max(.01,homeAttack*awayDefense/leagueH),a=Math.max(.01,awayAttack*homeDefense/leagueA);
  return {home:h,away:a,total:h+a,nHome:past.filter(r=>r.HomeTeam===home||r.AwayTeam===home).length,nAway:past.filter(r=>r.HomeTeam===away||r.AwayTeam===away).length};
 },
 async statsFor(comp,home,away){const d=Object.keys(this.DIVS).find(k=>this.DIVS[k]===comp);if(!d||!this.avg||!this.res)return null;

  const st={};for(const k of ["yc","sh","fo","th","co"]){const e=this.estimateMarket(rows,hn,an,k,new Date());st[k]=e?[e.home,e.away]:[h[k],a[k]]}return{st,info:{home:h._i,away:a._i}}},

function btRun(rows,key,line){
 const c=BT_COLS[key];if(!c)return{items:[],n:0};
 const sorted=rows.map((r,i)=>({...r,_i:i,_date:Csv.dt(r.Date,r.Time)})).filter(r=>r.HomeTeam&&r.AwayTeam&&r.Date&&Number.isFinite(r._date.getTime())&&r.FTHG!==''&&r.FTHG!=null&&r[c.h]!==''&&r[c.h]!=null&&r[c.a]!==''&&r[c.a]!=null).sort((a,b)=>a._date-b._date);
 const pastRows=[],items=[];
 for(const r of sorted){
  const estimate=Csv.estimateMarket(pastRows,r.HomeTeam,r.AwayTeam,key,r._date);
  if(estimate){const mu=estimate.total,p=Math.max(0,Math.min(1,pOver(line,mu))),actual=(+r[c.h])+(+r[c.a]);items.push({p,hit:actual>line?1:0,actual,mu,homeExpected:estimate.home,awayExpected:estimate.away,date:r._date,home:r.HomeTeam,away:r.AwayTeam})}
  // La ligne courante n'est ajoutée qu'après la prédiction : aucune fuite du futur.
  pastRows.push(r);
 }
 const n=items.length;if(!n)return{items,n:0,brier:null,acc80:null,observed80:null,meanP:null,rate:null};
 const brier=items.reduce((a,x)=>a+(x.p-x.hit)**2,0)/n,meanP=items.reduce((a,x)=>a+x.p,0)/n,rate=items.reduce((a,x)=>a+x.hit,0)/n,hi=items.filter(x=>x.p>=.8),acc80=hi.length?hi.reduce((a,x)=>a+x.hit,0)/hi.length:null;
 return{items,n,brier,meanP,rate,acc80,observed80:hi.length,loDate:items[0].date,hiDate:items[n-1].date};
}

 h+=`<div class="card"><label>Marché <select onchange="S.bm=this.value;go()">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${S.bm===k?'selected':''}>${v}</option>`).join('')}</select></label><label style="margin-left:10px">Ligne « plus de » <select onchange="S.bl=+this.value;go()">${[2.5,3.5,4.5,5.5,6.5,7.5,8.5,9.5,10.5,11.5,12.5,13.5,14.5,15.5,16.5,17.5,18.5,19.5,20.5,21.5,22.5,23.5,24.5,25.5,26.5,27.5,28.5,29.5,30.5,31.5,32.5,33.5,34.5,35.5].map(v=>`<option value="${v}" ${+S.bl===v?'selected':''}>${v}</option>`).join('')}</select></label><p class="sub">Modèle : intensité estimée par attaque à domicile/extérieur et statistiques concédées par l’adversaire, lissées vers la moyenne du championnat, puis loi de Poisson. Le bilan reste une évaluation historique et ne prouve pas à lui seul la rentabilité.</p></div>`;

 const recent=all.slice(-20).reverse();h+=`<h3>Dernières prédictions du backtest</h3>`+recent.map(x=>`<div class="card"><div class="row"><div><b>${x.home} – ${x.away}</b><div class="sub">${x.date.toLocaleDateString('fr-FR')} · total attendu ${x.mu.toFixed(1)} (dom. ${x.homeExpected.toFixed(1)} + ext. ${x.awayExpected.toFixed(1)})</div></div><div style="text-align:right"><b>${fpc(x.p)}</b><div class="sub">${x.hit?'Réussi':'Échoué'} · total ${x.actual}</div></div></div></div>`).join('');
 h+=`<div class="card"><b>Limites du bilan</b><p>Il utilise les lignes de statistiques disponibles dans les CSV, pas des instantanés historiques de toutes les informations publiées à l'époque. Il ne prend pas en compte les compositions, blessures, arbitres ni cotes historiques. La ligne de marché et le modèle doivent être testés sur plusieurs saisons avant toute conclusion. Le score de Brier ci-dessus concerne l'événement binaire « total strictement supérieur à la ligne ».</p></div>`;

}
