<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>MD ZE ZAYE — Analyse Football</title>
<style>
:root{--bg:#fff;--ink:#0f1b3d;--muted:#6b7a99;--card:#f5f8ff;--line:#dbe4f7;--pill:#eef2fb;--pillink:#5a6a8c;--blue:#2d5bff;--navy:#14213d;--red:#c92a3e;--redbg:#fdecef;--redline:#f3b6c0;--green:#1f8a55;--gold:#d4a017}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.crown{font-size:26px;color:var(--gold);line-height:1}.brand{font-weight:900;font-size:20px;letter-spacing:.5px}.sub{font-size:10px;color:var(--muted);letter-spacing:1.5px}
.wrap{max-width:760px;margin:auto;padding:6px 14px 96px}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--line);background:var(--pill);color:var(--pillink);border-radius:99px;padding:12px 20px;font:inherit;font-size:15px;font-weight:600}
.pill.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pill.live{color:var(--red)}.pill.live.on{background:var(--redbg);border-color:var(--redline);color:var(--red)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:6px}
.gh{display:flex;align-items:center;gap:12px;margin:22px 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.gh input{width:26px;height:26px;accent-color:var(--navy);flex:none;border-radius:6px}
.gh .fl{font-size:26px;line-height:1}.gh .gt{font-weight:800;font-size:18px;flex:1}
.chev{border:0;background:none;color:var(--muted);font-size:20px;font-weight:700;width:36px;height:36px;transition:transform .15s}
.chev.closed{transform:rotate(180deg)}
.mcard{display:grid;grid-template-columns:1fr 38px 78px 38px 1fr;align-items:center;gap:8px;padding:18px 14px;border:1px solid var(--line);background:var(--card);border-radius:22px;margin:10px 0;cursor:pointer}
.mcard .tn{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .tn.r{text-align:right}
.mcard img{width:38px;height:38px;object-fit:contain}
.mcard .tm{text-align:center;font-weight:800;font-size:22px}
.mcard .tm small{display:block;font-size:10px;font-weight:700;margin-top:1px}
.tm.livec{color:var(--red)}.tm small.l{color:var(--red)}.tm small.d{color:var(--muted)}
.sp{margin:-4px 4px 8px;padding:12px;border:1px solid var(--line);border-radius:16px;background:#fff}
.sh{font-weight:800;font-size:14px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sh small{font-weight:500;color:var(--muted);font-size:11px}
.sr{display:grid;grid-template-columns:54px 1fr 54px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #e8eefb;font-size:14px}
.sr:last-child{border:0}.sr b{font-size:16px}.sr b.r{text-align:right}.sr .lb{text-align:center;color:var(--muted);font-size:12px}
.sr .bar{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
.title{font-weight:850;font-size:18px;margin:0 0 10px}
.hint{font-size:12px;color:var(--muted);line-height:1.45}
.hidden{display:none!important}
label.l{display:block;color:var(--muted);font-size:12px;font-weight:600;margin:12px 0 6px}
.btn{border:1px solid var(--navy);border-radius:12px;background:#fff;color:var(--navy);padding:11px 14px;font:inherit;font-weight:700}
.btn.primary{background:var(--navy);color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:99px;background:var(--pill);color:var(--pillink);padding:9px 14px;font:inherit;font-size:14px;font-weight:600}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip small{font-weight:500;opacity:.8}
.checks label{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:15px}
.checks label.off{opacity:.45}
.checks input{width:24px;height:24px;accent-color:var(--navy);flex:none}
.checks .cnt{margin-left:auto;color:var(--muted);font-size:12px;text-align:right}
.stepper{display:flex;align-items:center;gap:14px}
.stepper b{font-size:24px;min-width:68px;text-align:center}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--navy);background:#fff;color:var(--navy);font-size:22px;font-weight:800}
.rowm{display:grid;grid-template-columns:50px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.rowm:last-child{border:0}.rowm .t{font-weight:800;color:var(--blue);font-size:14px}
.rowm .n{display:flex;flex-direction:column;gap:3px;font-size:14px;font-weight:600}.rowm .s{text-align:right;font-size:12px;color:var(--muted)}.rowm .s b{display:block;font-size:16px;color:var(--ink)}
.hd{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;margin-bottom:4px}
.hd .tm1{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:14px;font-weight:700;line-height:1.2}
.hd img,.hd .nologo{width:44px;height:44px;object-fit:contain}
.hd .vs{color:var(--muted);font-weight:800;font-size:12px}
.lg{width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:6px}
.rowm .n span{display:flex;align-items:center}
.est.real b{color:var(--green)}
.est.real.bad b{color:var(--red)}
.chk{display:flex;align-items:flex-start;gap:10px;margin-top:14px;font-size:14px;line-height:1.35}
.chk input{width:22px;height:22px;accent-color:var(--navy);flex:none}
.mc{padding:14px;border:1px solid var(--line);border-radius:18px;margin:12px 0;background:var(--card)}
.mc h4{margin:0 0 3px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.two>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.two b{font-size:13px;display:block;margin-bottom:3px}
.est{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:6px 0;font-size:14px}
.est b{color:var(--blue);font-size:20px}
.lad{display:grid;grid-template-columns:104px 1fr 44px;gap:8px;align-items:center;padding:4px 0;font-size:13px}
.lad.sel{color:var(--blue);font-weight:800}
.bar{height:8px;background:#e3e9f8;border-radius:10px;overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,#2d5bff,#7aa2ff)}
.lad b{text-align:right}
.pick{font-size:20px;font-weight:900;color:var(--blue);margin:6px 0 2px}
.pp{display:flex;align-items:center;gap:10px;margin:6px 0}.pp .bar{flex:1;height:10px}.pp b{font-size:18px}
.warning{border:1px solid #f0d58a;color:#6b5210;background:#fff8e1;padding:11px;border-radius:12px;font-size:12px;margin:12px 0;line-height:1.45}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px;line-height:1.5}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 2px calc(8px + env(safe-area-inset-bottom));z-index:3}
.bottom button{background:none;border:0;color:var(--muted);font-size:11px;flex:1;line-height:1.25;padding:4px 2px;font-weight:600}
.bottom button i{display:block;font-style:normal;font-size:20px}
.bottom button.active{color:var(--navy)}
.badge{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<header><div class="crown">♛</div><div><div class="brand">MD ZE ZAYE</div><div class="sub">ANALYSE • STATISTIQUES • PRONOSTICS</div></div></header>
<div class="wrap">

<section id="fixtures" class="page">
  <div class="tabs" id="dayTabs"></div>
  <div id="fixturesBody"></div>
</section>

<section id="filter" class="page hidden">
  <div class="card"><h2 class="title">Championnats</h2><div id="leagueBox"></div></div>
  <div class="card">
    <h2 class="title">Marché</h2>
    <div class="chips" id="marketChips"></div>
    <label class="l">Tendance recherchée</label>
    <div class="chips" id="trendChips"></div>
    <label class="l" id="lineLabel">Ligne</label>
    <div class="stepper"><button onclick="stepLine(-1)" aria-label="Baisser la ligne">−</button><b id="lineVal">9,5</b><button onclick="stepLine(1)" aria-label="Monter la ligne">+</button></div>
    <p class="hint" style="margin:10px 0 0" id="lineHelp"></p>
    <label class="chk"><input type="checkbox" id="incDone" onchange="setIncDone(this.checked)"><span>Inclure les matchs terminés (avec leurs statistiques réelles). Les matchs en direct sont toujours inclus.</span></label>
  </div>
  <div id="filterBody"></div>
</section>

<section id="analysis" class="page hidden"><div id="analysisBody"></div></section>
<section id="pronostics" class="page hidden"><div id="pronosBody"></div></section>
<section id="prediction" class="page hidden">
  <div class="card"><h2 class="title">Prédiction</h2><p>Rubrique réservée. Son rôle sera défini plus tard.</p><div class="warning">Aucune prédiction n’est lancée dans cette rubrique pour le moment.</div></div>
</section>

</div>
<nav class="bottom">
  <button class="active" data-page="fixtures"><i>⚽</i>Matchs du jour</button>
  <button data-page="filter"><i>☷</i>Filtre</button>
  <button data-page="analysis"><i>▥</i>Analyse</button>
  <button data-page="pronostics"><i>✓</i>Pronostics</button>
  <button data-page="prediction"><i>◉</i>Prédiction</button>
</nav>

<script>
'use strict';
const BASE = 'https://md-ze-zaye.onrender.com';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const f1 = v => v == null ? '—' : (Math.round(v * 10) / 10).toFixed(1).replace('.', ',');
const pc = v => Math.round(v * 100);
const todayISO = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Africa/Porto-Novo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const hhmm = utc => utc ? new Intl.DateTimeFormat('fr-FR', { timeZone: 'Africa/Porto-Novo', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(utc)) : '--:--';

// Noms / drapeaux (repli quand le calendrier vient de football-data.org)
const COMP = {
  PL: ['🇬🇧', 'Angleterre - Premier League'], ELC: ['🇬🇧', 'Angleterre - Championship'], PD: ['🇪🇸', 'Espagne - LaLiga'], SA: ['🇮🇹', 'Italie - Serie A'],
  BL1: ['🇩🇪', 'Allemagne - Bundesliga'], FL1: ['🇫🇷', 'France - Ligue 1'], PPL: ['🇵🇹', 'Portugal - Liga Portugal'], DED: ['🇳🇱', 'Pays-Bas - Eredivisie'],
  CL: ['🇪🇺', 'Ligue des champions'], EL: ['🇪🇺', 'Ligue Europa'], BSA: ['🇧🇷', 'Brésil - Série A'], WC: ['🌍', 'Coupe du monde'], EC: ['🇪🇺', 'Championnat d’Europe']
};
// Code de la compétition -> code utilisé par le serveur pour les statistiques (null = indisponible)
const STATS_CODE = { PL: 'PL', ELC: 'ELC', PD: 'PD', SA: 'SA', BL1: 'BL1', FL1: 'FL1', PPL: 'PPL', DED: 'DED', T1: 'T1', B1: 'B1', SC0: 'SC0', G1: 'G1', CL: 'CL', EL: 'ANY', ECL: 'ANY', UNL: 'ESPN' };
const covered = code => !!STATS_CODE[code];
const DONE = new Set(['FINISHED', 'CANCELLED', 'POSTPONED', 'SUSPENDED', 'AWARDED']);
const LIVE = new Set(['IN_PLAY', 'PAUSED']);

const MARKETS = {
  shots:   { label: 'Tirs',           f: 'shotsFor',   a: 'shotsAgainst',   v: 'shotsVar',   def: 24.5, range: [18.5, 30.5], noun: 'tirs' },
  fouls:   { label: 'Fautes',         f: 'foulsFor',   a: 'foulsAgainst',   v: 'foulsVar',   def: 24.5, range: [18.5, 30.5], noun: 'fautes' },
  throws:  { label: 'Touches',        unavailable: true, def: 38.5, range: [30.5, 46.5], noun: 'touches' },
  corners: { label: 'Corners',        f: 'cornersFor', a: 'cornersAgainst', v: 'cornersVar', def: 9.5,  range: [6.5, 12.5],  noun: 'corners' },
  cards:   { label: 'Cartons jaunes', f: 'yellowFor',  a: 'yellowAgainst',  v: 'yellowVar',  def: 4.5,  range: [2.5, 6.5],   noun: 'cartons jaunes' }
};

// ---------- Préférences ----------
const PK = 'mdzz_v3_prefs';
let prefs = { leagues: [], market: 'corners', trend: 'high', lines: {}, safe: 0.8, incDone: false };
try { Object.assign(prefs, JSON.parse(localStorage.getItem(PK) || '{}')); } catch (e) { /* valeurs par défaut */ }
if (!MARKETS[prefs.market]) prefs.market = 'corners';
const savePrefs = () => { try { localStorage.setItem(PK, JSON.stringify(prefs)); } catch (e) { /* ignoré */ } };
const lineOf = k => (prefs.lines && prefs.lines[k] != null) ? prefs.lines[k] : MARKETS[k].def;

// ---------- État ----------
let tab = 0;                       // 'live' ou décalage en jours (-1 hier, 0 aujourd'hui, 1 demain…)
const days = {};                   // date -> { state, fixtures, diag, error }
const closedGroups = new Set(), openStats = new Set();
const statsMap = {}, statsPending = new Set();
let statsLoading = false, statsError = '';
const dateOf = t => addDays(todayISO(), t === 'live' ? 0 : t);
const curDay = () => days[dateOf(tab)] || { state: 'idle', fixtures: [], diag: [] };
const dayFixtures = () => { const f = curDay().fixtures; return tab === 'live' ? f.filter(x => LIVE.has(x.status)) : f; };

async function api(path, opts, tries) {
  let last;
  for (let t = 0; t < (tries || 2); t++) {
    const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 45000);
    try {
      const r = await fetch(BASE + path, Object.assign({ signal: ctrl.signal, headers: { Accept: 'application/json' } }, opts || {}));
      clearTimeout(timer);
      if (!(r.headers.get('content-type') || '').includes('json')) throw new Error('Réponse inattendue du serveur (HTTP ' + r.status + ').');
      const d = await r.json();
      if (!r.ok) throw new Error(d.message || d.error || ('HTTP ' + r.status));
      return d;
    } catch (e) {
      clearTimeout(timer);
      last = e.name === 'AbortError' ? new Error('Le serveur met trop de temps à répondre (il se réveille peut-être).') : e;
      if (t < (tries || 2) - 1) await new Promise(r => setTimeout(r, 2000));
    }
  }
  throw last;
}

// ---------- Chargement des matchs d'un jour ----------
const fromEspn = m => ({
  id: m.id, code: m.code, comp: m.competition, flag: m.flag, utc: m.utcDate, status: m.status, clock: m.clock || '',
  home: m.home.name, away: m.away.name, homeLogo: m.home.crest || '', awayLogo: m.away.crest || '', hg: m.homeScore, ag: m.awayScore,
  homeId: m.home.id || '', awayId: m.away.id || '', eventId: String(m.id).replace(/^espn-/, '')
});
const fromFd = x => {
  const code = (x.competition && x.competition.code) || '', c = COMP[code] || ['⚽', (x.competition && x.competition.name) || code || 'Compétition'];
  const ft = x.score && x.score.fullTime ? x.score.fullTime : {};
  return { id: 'fd-' + x.id, code, comp: c[1], flag: c[0], utc: x.utcDate || '', status: x.status || '', clock: '',
    home: (x.homeTeam && x.homeTeam.name) || '', away: (x.awayTeam && x.awayTeam.name) || '',
    homeLogo: (x.homeTeam && x.homeTeam.crest) || '', awayLogo: (x.awayTeam && x.awayTeam.crest) || '', hg: ft.home == null ? null : ft.home, ag: ft.away == null ? null : ft.away };
};

async function fetchDay(date) {
  const diag = []; let list = [];
  try { const d = await api('/day?date=' + date); list = (d.matches || []).map(fromEspn); diag.push('ESPN : ' + list.length + ' match(s)'); (d.diag || []).forEach(x => diag.push(x)); }
  catch (e) { diag.push('ESPN : ' + e.message); }
  if (!list.length) {
    try {
      const d = await api('/matches?dateFrom=' + date + '&dateTo=' + date);
      list = (d.matches || []).map(fromFd); diag.push('football-data.org : ' + list.length + ' match(s)');
    } catch (e) { diag.push('football-data.org : ' + e.message); }
  }
  return { list: list.filter(x => x.home && x.away).sort((a, b) => String(a.utc).localeCompare(String(b.utc))), diag };
}

async function loadTab(force) {
  const date = dateOf(tab), cur = days[date];
  if (cur && (cur.state === 'loading' || (cur.state === 'ok' && !force))) { renderAll(); fetchStats(candidates()); return; }
  days[date] = { state: 'loading', fixtures: [], diag: [] }; renderAll();
  try { const r = await fetchDay(date); days[date] = { state: 'ok', fixtures: r.list, diag: r.diag }; }
  catch (e) { days[date] = { state: 'error', fixtures: [], diag: [], error: e.message }; }
  renderAll(); fetchStats(candidates());
}
function setTab(t) { tab = t; loadTab(false); }

// ---------- Matchs du jour ----------
function tabLabel(t) {
  if (t === 'live') return 'En direct'; if (t === -1) return 'Hier'; if (t === 0) return 'Aujourd’hui'; if (t === 1) return 'Demain';
  return new Intl.DateTimeFormat('fr-FR', { weekday: 'short', day: 'numeric', timeZone: 'UTC' }).format(new Date(dateOf(t) + 'T12:00:00Z'));
}
function groupByComp(list) {
  const g = {};
  list.forEach(f => { const k = f.code || f.comp; (g[k] = g[k] || { code: f.code, name: f.comp, flag: f.flag, items: [] }).items.push(f); });
  return Object.values(g).sort((a, b) => String(a.items[0].utc).localeCompare(String(b.items[0].utc)));
}
function center(f) {
  if (LIVE.has(f.status)) return '<div class="tm livec">' + esc(f.hg == null ? 0 : f.hg) + ' - ' + esc(f.ag == null ? 0 : f.ag) + '<small class="l">' + (f.status === 'PAUSED' ? 'MI-TEMPS' : '● ' + esc(f.clock || 'EN DIRECT')) + '</small></div>';
  if (f.status === 'FINISHED') return '<div class="tm">' + esc(f.hg == null ? '-' : f.hg) + ' - ' + esc(f.ag == null ? '-' : f.ag) + '<small class="d">Terminé</small></div>';
  if (f.status === 'POSTPONED') return '<div class="tm">' + hhmm(f.utc) + '<small class="d">Reporté</small></div>';
  if (f.status === 'CANCELLED') return '<div class="tm">' + hhmm(f.utc) + '<small class="d">Annulé</small></div>';
  return '<div class="tm">' + hhmm(f.utc) + '</div>';
}
const crest = u => u ? '<img src="' + esc(u) + '" alt="" loading="lazy">' : '<span></span>';
const lg = u => u ? '<img class="lg" src="' + esc(u) + '" alt="" loading="lazy">' : '';

function statsPanel(f) {
  if (!covered(f.code)) return '<div class="hint">Statistiques indisponibles pour cette compétition (aucune source gratuite).</div>';
  const s = statsMap[f.id];
  if (!s) return statsError ? '<div class="hint">Erreur : ' + esc(statsError) + '</div>' : '<div class="hint">Chargement des statistiques…</div>';
  if (s.error) return '<div class="hint">' + esc(s.error) + '</div>';
  const side = [s.home, s.away];
  for (const x of side) if (!x || !x.matched || !x.all) return '<div class="hint">« ' + esc(x ? x.requested : '?') + ' » introuvable dans la source des statistiques.</div>';
  const H = s.home.all, A = s.away.all;
  const rows = [['Matchs joués', 'n', 0], ['Buts marqués', 'goalsFor', 1], ['Tirs', 'shotsFor', 1], ['Fautes', 'foulsFor', 1], ['Corners', 'cornersFor', 1], ['Cartons jaunes', 'yellowFor', 1]]
    .map(r => {
      const h = H[r[1]], a = A[r[1]], t = h + a, sh = t > 0 ? Math.round(h / t * 100) : 50;
      return '<div class="sr"><b>' + (r[2] ? f1(h) : h) + '</b><div class="lb">' + r[0] + (r[2] ? '<div class="bar"><span style="width:' + sh + '%"></span></div>' : '') + '</div><b class="r">' + (r[2] ? f1(a) : a) + '</b></div>';
    }).join('');
  return '<div class="hint" style="margin-bottom:6px">Moyennes par match · ' + esc(f.home) + ' (gauche) — ' + esc(f.away) + ' (droite)' + (s.cross ? ' · moyennes du championnat national de chaque club' : '') + ([s.home, s.away].some(x => x && x.src === 'espn') ? ' · pour les clubs marqués ESPN : moyennes sur les matchs de la compétition (' + H.n + ' / ' + A.n + ' matchs)' : '') + '</div>' + rows +
    '<div class="hint" style="margin-top:6px">Touches et hors-jeu : aucune source gratuite.</div>';
}

const mstats = {};
const MROWS = [['Possession (%)', 'possession'], ['Tirs', 'shots'], ['Tirs cadrés', 'shotsOnTarget'], ['Corners', 'corners'], ['Fautes', 'fouls'],
  ['Cartons jaunes', 'yellow'], ['Cartons rouges', 'red'], ['Hors-jeu', 'offsides'], ['Arrêts', 'saves'], ['Touches', 'throwIns']];
async function loadMatchStats(f, force) {
  if (!f.eventId) return;
  const cur = mstats[f.id];
  if (cur && cur.loading) return;
  if (cur && cur.ok && !force && !LIVE.has(f.status)) return;
  mstats[f.id] = Object.assign({}, cur, { loading: true }); renderAll();
  try { mstats[f.id] = { ok: true, data: await api('/match-stats?code=' + encodeURIComponent(f.code) + '&event=' + encodeURIComponent(f.eventId), null, 1) }; }
  catch (e) { mstats[f.id] = { error: e.message }; }
  renderAll();
}
function matchStatsHtml(f) {

function toggleGroup(code) { closedGroups.has(code) ? closedGroups.delete(code) : closedGroups.add(code); renderFixtures(); }
function toggleStats(id) {

// ---------- Filtre ----------
function toggleLeague(code, on) { const s = new Set(prefs.leagues); on ? s.add(code) : s.delete(code); prefs.leagues = [...s]; savePrefs(); renderAll(); fetchStats(candidates()); }
function selectAll(on) { prefs.leagues = on ? groupByComp(dayFixtures()).map(g => g.code).filter(covered) : []; savePrefs(); renderAll(); fetchStats(candidates()); }
function setMarket(k) { prefs.market = k; savePrefs(); renderAll(); }
function setTrend(t) { prefs.trend = t; savePrefs(); renderAll(); }
function stepLine(d) { const k = prefs.market, v = Math.max(0.5, lineOf(k) + d); prefs.lines = Object.assign({}, prefs.lines, { [k]: v }); savePrefs(); renderAll(); }
function setSafe(v) { prefs.safe = v; savePrefs(); renderAll(); }
function setIncDone(v) { prefs.incDone = v; savePrefs(); renderAll(); fetchStats(candidates()); }

function candidates() { return dayFixtures().filter(f => prefs.leagues.includes(f.code) && (!DONE.has(f.status) || (prefs.incDone && (f.status === 'FINISHED' || f.status === 'AWARDED')))); }

async function fetchStats(list) {
  list.filter(f => f.eventId && (f.status === 'FINISHED' || LIVE.has(f.status))).forEach(f => loadMatchStats(f, false));
  const todo = list.filter(f => covered(f.code) && !(f.id in statsMap) && !statsPending.has(f.id));
  if (!todo.length) return;
  todo.forEach(f => statsPending.add(f.id)); statsLoading = true; statsError = ''; renderAll();
  try {
    for (let i = 0; i < todo.length; i += 30) {
      const chunk = todo.slice(i, i + 30);
      const d = await api('/stats/batch', {
        method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ items: chunk.map(f => ({ id: f.id, league: STATS_CODE[f.code], code: f.code, home: f.home, away: f.away, homeId: f.homeId, awayId: f.awayId })) })
      });
      chunk.forEach(f => { if (d.results && d.results[f.id]) statsMap[f.id] = d.results[f.id]; });
    }
  } catch (e) { statsError = e.message; }
  todo.forEach(f => statsPending.delete(f.id)); statsLoading = statsPending.size > 0; renderAll();
}

// ---------- Calculs ----------
function dist(mu, v) {
  const K = Math.max(40, Math.ceil(mu * 4 + 20)), p = new Array(K + 1);
  if (v <= mu * 1.02) { p[0] = Math.exp(-mu); for (let k = 1; k <= K; k++) p[k] = p[k - 1] * mu / k; }
  else { const r = mu * mu / (v - mu), q = mu / (r + mu); p[0] = Math.pow(1 - q, r); for (let k = 1; k <= K; k++) p[k] = p[k - 1] * (k - 1 + r) / k * q; }
  const t = p.reduce((a, b) => a + b, 0);
  return p.map(x => x / t);
}
function pOver(d, line) { let s = 0; for (let k = Math.ceil(line); k < d.length; k++) s += d[k]; return Math.min(1, s); }

function evaluate(f) {
  const mk = MARKETS[prefs.market];
  if (mk.unavailable) return { f, ok: false, reason: 'Aucune source gratuite ne fournit les touches.' };
  if (!covered(f.code)) return { f, ok: false, reason: 'Statistiques indisponibles pour cette compétition.' };
  const s = statsMap[f.id];
  if (!s) return { f, ok: false, pending: true, reason: 'Statistiques en cours de chargement.' };
  if (s.error) return { f, ok: false, reason: s.error };
  if (!s.home || !s.home.matched) return { f, ok: false, reason: '« ' + f.home + ' » introuvable dans la source.' };
  if (!s.away || !s.away.matched) return { f, ok: false, reason: '« ' + f.away + ' » introuvable dans la source.' };
  const H = s.home.all, A = s.away.all;
  if (!H || !A) return { f, ok: false, reason: 'Pas assez de matchs joués.' };
  const n = Math.min(H.n, A.n);
  const limited = [s.home, s.away].some(x => x && x.src === 'espn'), minN = limited ? 3 : 5;
  if (n < minN) return { f, ok: false, reason: 'Seulement ' + n + ' match(s) joué(s) par une des équipes (minimum ' + minN + ').' };
  const eh = (H[mk.f] + A[mk.a]) / 2, ea = (A[mk.f] + H[mk.a]) / 2, mu = eh + ea;
  const vs = [H[mk.v], A[mk.v]].filter(v => v != null), v = Math.max(mu, vs.length ? vs.reduce((a, b) => a + b, 0) / vs.length : mu);
  const cross = !!s.cross || limited;
  return { f, ok: true, s, H, A, eh, ea, mu, n, cross, level: cross ? 'faible' : (n >= 10 ? 'bonne' : 'moyenne'), dist: dist(mu, v) };
}
const REAL_KEY = { shots: 'shots', fouls: 'fouls', corners: 'corners', cards: 'yellow' };
function actualOf(f) {
  const m = mstats[f.id], k = REAL_KEY[prefs.market];
  if (!m || !m.ok || !k) return null;
  const h = m.data.home[k], a = m.data.away[k];
  return h == null || a == null ? null : { h, a, total: h + a };
}
const isPlayed = f => f.status === 'FINISHED' || LIVE.has(f.status);
function passes(e) { const line = lineOf(prefs.market); return prefs.trend === 'high' ? e.mu >= line : e.mu <= line; }

function pick(e) {
  const mk = MARKETS[prefs.market], thr = prefs.safe + (e.cross ? 0.05 : 0);
  if (e.n < 6) return null;
  const lines = []; for (let l = mk.range[0]; l <= mk.range[1] + 0.01; l += 1) lines.push(l);
  if (prefs.trend === 'high') { for (let i = lines.length - 1; i >= 0; i--) { const p = pOver(e.dist, lines[i]); if (p >= thr) return { dir: 'Plus de', line: lines[i], p }; } }
  else { for (let i = 0; i < lines.length; i++) { const p = 1 - pOver(e.dist, lines[i]); if (p >= thr) return { dir: 'Moins de', line: lines[i], p }; } }
  return null;
}

function evaluated() {
  const all = candidates().map(evaluate), line = lineOf(prefs.market);
  const kept = all.filter(e => e.ok && passes(e));
  kept.sort((a, b) => prefs.trend === 'high' ? (b.mu - line) - (a.mu - line) : (a.mu - line) - (b.mu - line));
  return { all, kept, pending: all.some(e => e.pending), excluded: all.filter(e => !e.ok && !e.pending), below: all.filter(e => e.ok && !passes(e)) };
}

// ---------- Rendu Filtre ----------
function rowMatch(f, right) {

  return '<div class="rowm"><div class="t">' + hhmm(f.utc) + '</div><div class="n"><span>' + lg(f.homeLogo) + esc(f.home) + '</span><span>' + lg(f.awayLogo) + esc(f.away) + '</span></div><div class="s">' + (right || score) + '</div></div>';
}
function dayLabel() { return tab === 'live' ? 'en direct (aujourd’hui)' : tabLabel(tab).toLowerCase(); }

      h += '<div class="card"><h2 class="title">Matchs retenus : ' + ev.kept.length + '</h2><div class="hint">' + candidates().length + ' match(s) dans les championnats cochés · ' + ev.below.length + ' sans tendance · ' + ev.excluded.length + ' sans données fiables</div>' +

// ---------- Rendu Analyse ----------
function header(e) {

}
function contextHtml(title) {
  const mk = MARKETS[prefs.market];
  return '<div class="card"><h2 class="title">' + title + '</h2><div class="hint">Jour : <b>' + esc(tabLabel(tab)) + '</b> · marché : <b>' + mk.label + '</b> · tendance ' + (prefs.trend === 'high' ? 'élevée' : 'faible') + ' · ligne ' + f1(lineOf(prefs.market)) + ' (modifiable dans Filtre)</div></div>';
}
function gate(title) {
  const mk = MARKETS[prefs.market];
  if (mk.unavailable) return contextHtml(title) + '<div class="warning">Touches : aucune source gratuite ne fournit cette statistique. Choisis un autre marché dans Filtre.</div>';
  if (!prefs.leagues.length) return contextHtml(title) + '<div class="empty">Va dans Filtre (ou coche un championnat dans Matchs du jour) et choisis un marché.</div>';
  if (curDay().state !== 'ok') return contextHtml(title) + '<div class="empty">Les matchs ne sont pas encore chargés.</div>';
  const ev = evaluated();
  if (statsLoading || (ev.pending && !statsError)) return contextHtml(title) + '<div class="empty">Chargement des statistiques des équipes…</div>';
  if (statsError) return contextHtml(title) + '<div class="warning">Erreur de chargement des statistiques : ' + esc(statsError) + ' <button class="btn" onclick="fetchStats(candidates())">Réessayer</button></div>';
  return null;
}
function realHtml(e, line, high) {
  if (!isPlayed(e.f)) return '';

  if (!ac) return '<div class="hint" style="margin:4px 0">' + (m && m.loading ? 'Chargement des statistiques réelles du match…' : 'Statistiques réelles du match indisponibles (ESPN).') + '</div>';

  return '<div class="est real ' + (live || ok ? '' : 'bad') + '"><span>' + (live ? 'En cours : ' : 'Réel : ') + ac.h + ' + ' + ac.a + '</span><span>Total <b>' + ac.total + '</b> ' + (live ? '' : (ok ? '✓' : '✗')) + '</span></div>';
}
function renderAnalysis() {
  const g = gate('Analyse'); if (g) { $('analysisBody').innerHTML = g; return; }

    const lad = [-2, -1, 0, 1, 2].map(d => line + d).filter(l => l > 0).map(l => {
      const p = high ? pOver(e.dist, l) : 1 - pOver(e.dist, l);
      return '<div class="lad ' + (l === line ? 'sel' : '') + '"><span>' + (high ? 'Plus de ' : 'Moins de ') + f1(l) + '</span><div class="bar"><span style="width:' + pc(p) + '%"></span></div><b>' + pc(p) + ' %</b></div>';
    }).join('');
    h += '<div class="mc">' + header(e) +
      '<div class="two"><div><b>' + lg(e.f.homeLogo) + esc(e.f.home) + '</b><div class="hint">pour ' + f1(e.H[mk.f]) + ' · contre ' + f1(e.H[mk.a]) + '<br>' + e.H.n + ' matchs</div></div>' +
      '<div><b>' + lg(e.f.awayLogo) + esc(e.f.away) + '</b><div class="hint">pour ' + f1(e.A[mk.f]) + ' · contre ' + f1(e.A[mk.a]) + '<br>' + e.A.n + ' matchs</div></div></div>' +
      '<div class="est"><span>' + f1(e.eh) + ' + ' + f1(e.ea) + '</span><span>Total attendu <b>' + f1(e.mu) + '</b></span></div>' + realHtml(e, line, high) + lad +
      '<div class="hint" style="margin-top:8px">Fiabilité : <b>' + e.level + '</b>' + (e.cross ? ' · moyennes du championnat national de chaque club (pas des matchs européens)' : '') + ([e.s.home, e.s.away].some(x => x && x.src === 'espn') ? ' · moyennes calculées sur les matchs de la compétition (ESPN)' : '') + '. « pour » = moyenne par match de l’équipe, « contre » = moyenne concédée.</div></div>';
  });
  $('analysisBody').innerHTML = h;
}

// ---------- Rendu Pronostics ----------
function resultHtml(e, p) {

  const ac = actualOf(e.f);
  if (!ac) return '<div class="hint" style="margin:6px 0">Résultat réel indisponible pour le moment.</div>';
  if (LIVE.has(e.f.status)) return '<div class="est real"><span>En cours</span><span><b>' + ac.total + '</b> ' + MARKETS[prefs.market].noun + ' pour l’instant</span></div>';
  const win = p.dir === 'Plus de' ? ac.total > p.line : ac.total < p.line;
  return '<div class="est real ' + (win ? '' : 'bad') + '"><span>Résultat réel</span><span><b>' + ac.total + '</b> ' + MARKETS[prefs.market].noun + ' ' + (win ? '✓ prono réussi' : '✗ prono raté') + '</span></div>';
}
function renderPronostics() {
  const g = gate('Pronostics'); if (g) { $('pronosBody').innerHTML = g; return; }
  const ev = evaluated(), mk = MARKETS[prefs.market];
  const picks = ev.kept.map(e => ({ e, p: pick(e) })), good = picks.filter(x => x.p).sort((a, b) => b.p.p - a.p.p), none = picks.filter(x => !x.p);
  let h = contextHtml('Pronostics safe') + '<div class="card"><label class="l" style="margin-top:0">Niveau de sécurité minimum</label><div class="chips">' +
    [[0.75, '75 %'], [0.8, '80 %'], [0.85, '85 %']].map(([v, t]) => '<button class="chip ' + (prefs.safe === v ? 'on' : '') + '" onclick="setSafe(' + v + ')">' + t + '</button>').join('') +
    '</div><p class="hint" style="margin:10px 0 0">Pour chaque match analysé, le prono est la ligne la plus ' + (prefs.trend === 'high' ? 'haute' : 'basse') + ' que le modèle estime atteinte avec au moins cette probabilité.</p></div>';
  if (!ev.kept.length) h += '<div class="empty">Aucun match analysé. Va dans Filtre.</div>';
  good.forEach(x => {
    const e = x.e, p = x.p;
    h += '<div class="mc">' + header(e) + '<div class="pick">' + p.dir + ' ' + f1(p.line) + ' ' + mk.noun + '</div>' +
      '<div class="pp"><div class="bar"><span style="width:' + pc(p.p) + '%"></span></div><b>' + pc(p.p) + ' %</b></div>' +
      resultHtml(e, p) + '<div class="hint">Total attendu ' + f1(e.mu) + ' · ' + e.n + ' matchs minimum par équipe · fiabilité <b>' + e.level + '</b>' + (e.cross ? ' · moyennes du championnat national : seuil relevé de 5 points' : '') + '</div></div>';
  });
  if (ev.kept.length && !good.length) h += '<div class="empty">Aucun prono safe à ce niveau. Baisse le niveau de sécurité ou change de marché.</div>';
  if (none.length && good.length) h += '<div class="card"><div class="hint">' + none.length + ' match(s) analysé(s) sans prono safe : ' + none.map(x => esc(x.e.f.home) + ' — ' + esc(x.e.f.away)).join(' · ') + '</div></div>';
  h += '<div class="warning">Ce sont des estimations statistiques à partir des moyennes de la saison, sans cotes, sans blessures ni compositions. Un prono « safe » n’est jamais sans risque : ne mise que ce que tu peux te permettre de perdre.</div>';
  $('pronosBody').innerHTML = h;
}

// ---------- Navigation ----------
function renderAll() { renderFixtures(); renderFilter(); renderAnalysis(); renderPronostics(); }
function show(id) {
  document.querySelectorAll('.page').forEach(x => x.classList.add('hidden'));
  $(id).classList.remove('hidden');
  document.querySelectorAll('[data-page]').forEach(b => b.classList.toggle('active', b.dataset.page === id));
  window.scrollTo(0, 0);
}
document.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => show(b.dataset.page)));
loadTab(false);
</script>
